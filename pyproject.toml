[project]
name = "energy-training"
version = "0.1.0.dev0"
description = "Python package for the course 'Dynamic Modelling, Modelica and Techno-Economic Optimization of Energy Systems'"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniele Schiera" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "fmpy>=0.3.30",
]

[project.optional-dependencies]
# Optional, introduced only in Session 8 extensions
casadi = ["casadi>=3.7"]
# Optional: drive omc from Python instead of the shell scripts
omc = ["OMPython>=4.0"]

[dependency-groups]
# Notebook interface for instructors and participants: JupyterLab is the main IDE.
# Installed by a plain `uv sync` (see [tool.uv] default-groups below).
notebooks = [
    "jupyterlab>=4.6",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[tool.uv]
# `uv sync` and `uv run` install both groups unless told otherwise (uv-docs, dependency groups).
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/energy_training"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "tests"]
addopts = "-ra"
markers = [
    "omc: requires OpenModelica (omc or Docker)",
    "fmu: requires a built FMU",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Starting notebooks are incomplete by design: imports the participant will use and
# names defined in the cells they complete.
"exercises/**/*.ipynb" = ["F401", "F821", "F841"]
